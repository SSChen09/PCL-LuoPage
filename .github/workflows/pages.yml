# PCL 主页自动构建 + 发布到 GitHub Pages
#
# 首次使用要做两件事：
#   1. 仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」
#   2. PCL 里：设置 → 个性化 → 主页 → 来源选「联网」，地址填
#      https://sschen09.github.io/PCL-LuoPage/Custom.xaml
#
# 之后每天北京时间 04:17 自动重建一次（有新版本才看得出变化），
# 也可以在 Actions 页面点「Run workflow」手动触发。
#
# 每次构建完会把 Custom.xaml 提交回仓库：
#   一是让仓库里的副本保持最新，二是公开仓库连续 60 天无活动会被 GitHub
#   自动停用定时任务，这些提交正好让它保持活跃。

name: Build & Deploy PCL Homepage

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *"   # UTC 20:17 = 北京时间次日 04:17
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限把生成结果提交回去，顺便避免 60 天闲置被停用
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 生成 Custom.xaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 抓取版本数据并渲染
        run: node homepage/build.mjs

      - name: 校验产物
        run: |
          test -s homepage/dist/Custom.xaml
          grep -q "local:MyCard" homepage/dist/Custom.xaml
          echo "生成成功，大小 $(wc -c < homepage/dist/Custom.xaml) 字节"

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Custom.xaml homepage/dist/Custom.xaml
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 自动更新主页数据"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: homepage/dist

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
